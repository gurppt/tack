name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm cmake
      - name: Native build prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for nasm_attempt in 1 2 3; do
            if choco install nasm --version=2.16.03 -y; then
              exit 0
            fi
            if [ "$nasm_attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1
      - name: Prepare pinned native decoder
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          python tools/prepare_turbojpeg.py
      - name: Install About asset preparation dependency
        run: python -m pip install Pillow==10.2.0
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Corpus correctness tests
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install Pillow==10.2.0
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: GPU smoke on software Vulkan
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          cargo test -p tack-render --test gpu_smoke --locked -- --ignored
          cargo test -p tack-render --test selection_gpu --locked -- --ignored
          cargo test -p tack-render --test product_gpu --locked -- --include-ignored
          cargo test -p tack-app --test lod_convergence --locked -- --ignored --test-threads=1
          cargo test -p tack-app --test lod_long_churn --locked -- --ignored --test-threads=1
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
