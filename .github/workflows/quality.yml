name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Corpus correctness tests
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install Pillow==10.2.0
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: GPU smoke on software Vulkan
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          cargo test -p tack-render --test gpu_smoke --locked -- --ignored
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
