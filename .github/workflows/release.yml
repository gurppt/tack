name: Portable alpha candidate
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA or immutable version tag
        required: true
      channel:
        type: choice
        options: [dev, stable]
        default: dev
      mode:
        description: Public publication requires a separate owner decision
        type: choice
        options: [dry-run, draft]
        default: dry-run
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      TACK_BUILD_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm cmake pkg-config libx11-dev libxext-dev libxfixes-dev x11proto-dev
      - if: runner.os == 'Windows'
        run: choco install nasm --version=2.16.03 -y
      - shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          python -m pip install Pillow==10.2.0
          if [ "$RUNNER_OS" = Linux ]; then bash tools/prepare_linux.sh; fi
          python tools/prepare_turbojpeg.py
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo check -p tack-app --no-default-features --all-targets --locked
          cargo build --release --locked -p tack-app -p tack-server -p tack-updater
          python tools/package_release.py --binary-dir target/release --platform ${{ matrix.platform }} --channel ${{ inputs.channel }} --output release-assets
      - if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
          python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: |
            release-assets/*.zip
            release-assets/manifest-*.json
          retention-days: 7
  manifest:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - run: python3 tools/package_release.py --output release-assets --merge release-assets/manifest-linux-x86_64.json release-assets/manifest-windows-x86_64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-alpha-candidate
          path: release-assets/*
          retention-days: 7
      - if: inputs.mode == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("release-assets/update-manifest.json"))["version"])')
          commit=$(git rev-parse HEAD)
          # Refuse an existing release/tag; never replace published bytes.
          if gh release view "v$version" >/dev/null 2>&1; then exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then exit 1; fi
          channel=$(python3 -c 'import json; print(json.load(open("release-assets/update-manifest.json"))["channel"])')
          flags=()
          if [ "$channel" = dev ]; then flags+=(--prerelease); fi
          gh release create "v$version" --target "$commit" --draft "${flags[@]}" --title "Tack $version" --notes-file CHANGELOG.md release-assets/tack-linux-x86_64.zip release-assets/tack-windows-x86_64.zip release-assets/update-manifest.json
