[package]
name = "tack-windows-dialogs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# The safe facade confines COM FFI here. Core/app retain workspace forbid(unsafe_code).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
tack-windows-io.workspace = true
